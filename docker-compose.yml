services:
    app:
        container_name: vayro-app
        build:
            context: ./apps/api
            dockerfile: Dockerfile
        image: vayro/laravel-app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./apps/api:/var/www
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_started
        networks:
            - vayro

    nginx:
        container_name: vayro-nginx
        image: nginx:alpine
        restart: unless-stopped
        ports:
            - "8989:80"
        volumes:
            - ./apps/api:/var/www
            - ./infra/docker/nginx/:/etc/nginx/conf.d/
        depends_on:
            - app
        networks:
            - vayro

    # postgresql
    pgsql:
        container_name: vayro-pgsql
        image: postgres:16-alpine
        restart: unless-stopped
        env_file:
            - ./infra/postgres/.env
        volumes:
            - ./.docker/pgsql/dbdata:/var/lib/postgresql/data
        ports:
            - "5432:5432"
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - vayro

    # queue
    queue:
        container_name: vayro-queue
        image: vayro/laravel-app
        restart: unless-stopped
        command: "php artisan queue:work"
        working_dir: /var/www
        volumes:
            - ./apps/api:/var/www
        depends_on:
            - redis
            - app
        networks:
            - vayro

    # redis
    redis:
        container_name: vayro-redis
        image: redis:alpine
        restart: unless-stopped
        networks:
            - vayro

    frontend:
        container_name: vayro-frontend
        image: node:22-alpine
        restart: unless-stopped
        working_dir: /app
        ports:
            - "5173:5173"
        volumes:
            - ./apps/web:/app
            - frontend_node_modules:/app/node_modules
        environment:
            - VITE_API_BASE_URL=http://localhost:8989
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
        depends_on:
            - nginx
        networks:
            - vayro

networks:
    vayro:
        driver: bridge

volumes:
    frontend_node_modules:
